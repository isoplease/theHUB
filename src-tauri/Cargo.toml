[package]
name = "thehub"
version = "3.5.3"
description = "theHUB desktop workspace built with Tauri, React and TypeScript"
authors = ["isoplease"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "ico"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
wintheon = "0.1.0"
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Data_Pdf", "Storage", "Storage_Streams", "Win32_System_WinRT", "Media_Ocr", "Graphics_Imaging", "Globalization"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-future = "0.3.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
